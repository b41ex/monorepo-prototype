name: e2e

# ---------------------------------------------------------------------------------------
# Stand the whole product up on one runner and drive it: Newman over the REST API, then the
# Playwright Portal suite from tests/ui-tests.
#
# Called two ways, and the difference is ONE STEP.
#
#   repoint_images: true    the compose file is pointed at the images this CI run published.
#                           This is the reason the monorepo exists, stated as a job: a stack
#                           assembled from one commit rather than from whatever each
#                           repository's :dev tag last happened to point at.
#
#   repoint_images: false   the compose file is left naming upstream's :dev images, and
#                           everything else is identical. This is the BASELINE, and it exists
#                           because a red suite says nothing about whose fault it is until the
#                           same suite has been run against something else.
#
# The suite is held constant across both and only the images vary, which is what makes the
# comparison mean anything. Note the test is one-sided: a failure that also fails upstream is
# demonstrably not ours, while one that passes upstream is either ours OR a consequence of
# upstream :dev having moved on from the sources this workspace was cut from.
# ---------------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      repoint_images:
        description: Point the compose file at this run's images instead of upstream ':dev'.
        required: false
        type: boolean
        default: true
      tier:
        description: >-
          full runs everything; smoke runs the Portal smoke collection and the @smoke-tagged
          Playwright tests. Setup is the same either way and is most of the fixed cost.
        required: false
        type: string
        default: full
      image_owner:
        description: >-
          ghcr owner the five images are pulled from. Defaults to this repository's owner.
          TEMPORARY: it exists only because the prototype publishes under a personal account
          instead of the organisation. Once this is the real monorepo, owner and repository
          owner are the same thing and this input should be deleted.
        required: false
        type: string
        default: ''
      image_tag:
        description: >-
          Tag for all five images, when the per-image tags below are left empty. Defaults to
          this ref's branch tag.
        required: false
        type: string
        default: ''
      tag_portal_backend:
        description: Overrides image_tag for portal-backend. A src-<hash> tag pins exact content.
        required: false
        type: string
        default: ''
      tag_build_task_consumer:
        description: Overrides image_tag for build-task-consumer.
        required: false
        type: string
        default: ''
      tag_ui:
        description: Overrides image_tag for ui.
        required: false
        type: string
        default: ''
      tag_api_linter_service:
        description: Overrides image_tag for api-linter-service.
        required: false
        type: string
        default: ''
      tag_agents_backend:
        description: Overrides image_tag for agents-backend.
        required: false
        type: string
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 90, not 60. Measured on the first full run: 57.2 minutes wall clock, of which the
    # Playwright Portal suite was 49. Sixty left under three minutes of headroom, and a job
    # killed by its timeout mid-suite produces no report and reads as a failure of the thing
    # being tested rather than of the limit.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: e2e

      - name: Install podman and envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose gettext-base

      # The prototype's packages are private, unlike the upstream ones this compose file
      # names, so the pull needs credentials that the original workflow never had to supply.
      - name: Log in to ghcr
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Clone the compose repository
        run: |
          git clone --branch main --single-branch \
            https://github.com/Netcracker/qubership-apihub compose-repo

      # Exactly what generate_env_and_up_compose.sh does locally, minus the random email.
      - name: Generate the stack's own credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -out rsakey.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          key="$(base64 -w0 rsakey.pem)"
          # NOT `tr -dc … </dev/urandom | head -c N`, which is what the compose repository's own
          # script uses. `head` closes the pipe, `tr` dies of SIGPIPE, and under `set -o pipefail`
          # the whole step exits 141 having printed nothing. Reproduced locally at exit 141
          # before this line was changed. openssl is already here for the key and needs no pipe.
          pass="$(openssl rand -hex 12)"
          token="$(openssl rand -hex 30)"
          # Masked even though they are throwaway. The password reaches Playwright, which is
          # verbose on failure, and an unmasked credential in a public run log teaches the
          # wrong habit whatever its lifetime.
          echo "::add-mask::$key"
          echo "::add-mask::$pass"
          echo "::add-mask::$token"
          {
            echo "JWT_PRIVATE_KEY=$key"
            # DELIBERATELY NOT the suite's own sysadmin address. An earlier version of this
            # file pinned it to x_atui_sysadmin@qa.at and that cost 14 Playwright failures.
            #
            # The backend creates a zero-day admin from this value at startup, in
            # ZeroDayAdminService.CreateZeroDayAdmin, as InternalUser{Email, Password} with
            # NO name. The suite then creates its own sysadmin, with a name, in
            # apihub-setup.ts via UsersTestDataManager.createSysadmin. When the two addresses
            # collide that second call gets 400 "already exists", logs it and returns WITHOUT
            # ever applying the name — so the account keeps its email as the display value and
            # every assertion on a "published by" cell reads x_atui_sysadmin@qa.at where it
            # expects x_ATUI_Sysadmin.
            #
            # Nothing logs in as this account except Newman, which templates whatever is here.
            echo "APIHUB_ADMIN_EMAIL=zero-day-admin@apihub.local"
            echo "APIHUB_ADMIN_PASSWORD=$pass"
            echo "APIHUB_ACCESS_TOKEN=$token"
          } >> "$GITHUB_ENV"
          rm -f rsakey.pem
          echo "generated a 2048-bit key, a 24-character password and a 60-character token"

      - name: Template the env and config files
        shell: bash
        run: |
          set -euo pipefail
          cd compose-repo
          find . -name '*.env' -print0 | while IFS= read -r -d '' f; do
            envsubst < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          cd docker-compose/apihub-generic
          find . -name '*config.yaml' -print0 | while IFS= read -r -d '' f; do
            envsubst < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      # The compose file names five upstream images. Each is repointed at the image THIS run
      # published, which is the whole point of the job: one commit, one stack.
      #
      # The names do not line up one-to-one, and portal-backend is the reason. §3 renamed it
      # because `backend/backend/` was the alternative, so the image that serves
      # `qubership-apihub-backend` here is `apihub-portal-backend` there.
      - name: Point the compose file at this run's images
        # Skipped for a baseline run, which is the whole mechanism: leave the compose file
        # naming upstream's `:dev` images and everything else about the job identical, so the
        # images are the only variable between the two runs.
        if: ${{ inputs.repoint_images }}
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          branch_tag="$(echo "$ref" | sed 's@refs/tags/@@;s@refs/heads/@@;s@refs/pull/@pull/@;s@^main$@latest@;s@^develop$@dev@;s@^release$@next@;s@/@-@g;')"

          owner='${{ inputs.image_owner }}'
          [ -n "$owner" ] || owner='${{ github.repository_owner }}'
          owner="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"

          # A run's five images share a branch tag, but that tag MOVES on the next push. The
          # only stable handle on "the images run N built" is each image's own src-<hash>, and
          # those five differ. Hence five overrides rather than one: pinning a past run means
          # naming five hashes, and there is no single value that could do it.
          default_tag='${{ inputs.image_tag }}'
          [ -n "$default_tag" ] || default_tag="$branch_tag"
          t_pb='${{ inputs.tag_portal_backend }}';      [ -n "$t_pb" ] || t_pb="$default_tag"
          t_bc='${{ inputs.tag_build_task_consumer }}';  [ -n "$t_bc" ] || t_bc="$default_tag"
          t_ui='${{ inputs.tag_ui }}';                   [ -n "$t_ui" ] || t_ui="$default_tag"
          t_al='${{ inputs.tag_api_linter_service }}';   [ -n "$t_al" ] || t_al="$default_tag"
          t_ab='${{ inputs.tag_agents_backend }}';       [ -n "$t_ab" ] || t_ab="$default_tag"

          cd compose-repo/docker-compose/apihub-generic

          repoint() {  # $1 upstream image name, $2 ours, $3 tag
            sed -i "s|ghcr.io/netcracker/$1:[^ ]*|ghcr.io/$owner/$2:$3|g" docker-compose.yml
          }
          repoint qubership-apihub-backend              apihub-portal-backend       "$t_pb"
          repoint qubership-apihub-build-task-consumer  apihub-build-task-consumer  "$t_bc"
          repoint qubership-apihub-ui                   apihub-ui                   "$t_ui"
          repoint qubership-api-linter-service          apihub-api-linter-service   "$t_al"
          repoint qubership-apihub-agents-backend       apihub-agents-backend       "$t_ab"

          # Validate the substitution rather than trusting sed's exit code, which is 0 whether
          # it matched anything or not. Five images must now be ours and none may be upstream.
          mine="$(grep -c "image: ghcr.io/$owner/" docker-compose.yml || true)"
          theirs="$(grep -c 'image: ghcr.io/netcracker/' docker-compose.yml || true)"
          echo "images pointing at $owner: $mine, still upstream: $theirs"
          grep -E '^\s*image:' docker-compose.yml | sed 's/^/  /'
          [ "$mine" = "5" ] && [ "$theirs" = "0" ] || {
            echo "::error::expected 5 images repointed and 0 left upstream"
            exit 1
          }

      - name: Bring the stack up
        run: |
          cd compose-repo/docker-compose/apihub-generic
          podman-compose -f docker-compose.yml up -d

      - name: Start collecting container logs
        run: |
          for c in qubership-apihub-backend postgres qubership-apihub-ui \
                   qubership-apihub-build-task-consumer qubership-api-linter-service \
                   qubership-apihub-agents-backend; do
            podman logs -f "$c" > "./$c.log" 2>&1 &
          done

      - name: Wait for APIHUB to answer
        shell: bash
        run: |
          set -euo pipefail
          end=$((SECONDS + 300))
          while [ $SECONDS -lt $end ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/login || true)"
            [ "$code" = "200" ] && { echo "up after ${SECONDS}s"; exit 0; }
            echo "  http $code, retrying"
            sleep 5
          done
          echo "::error::APIHUB did not answer 200 on /login within 5 minutes"
          podman ps -a
          exit 1

      - name: Run the postman collections
        id: newman
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install -g newman newman-reporter-htmlextra
          git clone --branch develop --single-branch \
            https://github.com/Netcracker/qubership-apihub-postman-collections postman-repo
          cd postman-repo
          envsubst < ./environment/local.postman_environment.json > ./ci.postman_environment.json
          mkdir -p reports

          # smoke is the Portal smoke collection alone. full adds the rest of the PORTAL-side
          # collections; 1_2_Smoke_Agent and 2_2_Negative_Agent are deliberately absent from
          # both tiers, because the compose stack runs no agent service for them to talk to.
          # Adding that container is a separate decision.
          if [ '${{ inputs.tier }}' = 'smoke' ]; then
            collections='1_1_Smoke_Portal'
          else
            collections='1_1_Smoke_Portal 1_3_Linter_Portal 2_1_Negative_Portal
                         3_1_Stories_Bugs 3_2_Stories_Bugs 4_Access_control'
          fi

          for c in $collections; do
            echo "=== $c ==="
            newman run "./e2e/${c}.postman_collection.json" \
              -e ./ci.postman_environment.json -x \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export "./reports/${c}.html"
          done

      - name: Install Playwright browsers
        working-directory: tests/ui-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Playwright suite
        id: playwright
        continue-on-error: true
        working-directory: tests/ui-tests
        env:
          BASE_URL: http://localhost:8081
          TEST_USER_PASSWORD: ${{ env.APIHUB_ADMIN_PASSWORD }}
          PLAYGROUND_BACKEND_HOST: http://host.docker.internal:8081
          CLEAR_TD: skip
        run: |
          # --grep does NOT filter the dependency projects, which is the thing that would have
          # broken this silently: Portal-Setup is untagged, and if grep had removed it the smoke
          # tests would run against a stack with no test data and fail as a body. Measured on
          # the real config with --list: Portal 618 -> 261 under --grep=@smoke, while
          # Portal-Setup stays at 36 and Apihub-Setup at 1.
          args='--project=Portal --grep-invert=@flaky'
          [ '${{ inputs.tier }}' = 'smoke' ] && args="$args --grep=@smoke"
          echo "playwright $args"
          pnpm exec playwright test $args

      # Three artifacts rather than one, named as the workflow this replaces named them, so
      # that someone chasing a red run downloads the 200 KB they want instead of 32 MB of
      # everything. Each is `always()`: the logs matter most on the run that failed.
      #
      # NOT copied from the original: it writes `retention-days: 7` INSIDE the `path:` block
      # on all three of its uploads, which makes it a path glob rather than a setting. Those
      # artifacts keep the 90-day default and every upload warns about a path that matches
      # nothing. Here it is a sibling key and the last run's artifact duly expired in 7 days.
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: containers-logs
          path: '*.log'
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-reports
          path: postman-repo/reports
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: tests/ui-tests/reports
          if-no-files-found: warn
          retention-days: 7

      # Both suites run with continue-on-error so that a Playwright failure still produces
      # Newman's report and the container logs. The verdict is taken here instead.
      - name: Verdict
        shell: bash
        run: |
          set -euo pipefail
          newman='${{ steps.newman.outcome }}'
          play='${{ steps.playwright.outcome }}'
          {
            echo '### E2E'
            echo
            echo '| suite | outcome |'
            echo '|---|---|'
            echo "| postman collections | \`$newman\` |"
            echo "| playwright, Portal | \`$play\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$newman" = 'success' ] && [ "$play" = 'success' ] || {
            echo "::error::newman=$newman playwright=$play"
            exit 1
          }
