name: e2e baseline

# ---------------------------------------------------------------------------------------
# The same E2E job as CI, against upstream's `:dev` images instead of this run's.
#
# It answers one question and only one: of the tests that fail in CI, which also fail without
# any of this workspace's images in the stack. A failure present in both is not the migration's
# and needs no further argument; a failure present only in CI needs one.
#
# Manual, because it is a comparison run rather than a gate. It builds nothing, publishes
# nothing and blocks nothing.
# ---------------------------------------------------------------------------------------

on:
  # `workflow_dispatch` alone cannot start this. GitHub resolves a dispatchable workflow from
  # the DEFAULT branch, and this file lives only on the feature branch, so the API answers
  # `404: workflow e2e-baseline.yml not found on the default branch` however the ref is set.
  #
  # Pushing a throwaway `e2e-baseline/<name>` branch starts it instead, and costs no change to
  # a shared branch to arrange. ci.yml triggers on main, develop, release, hotfix, feature/**
  # and bugfix/**, so that prefix runs this and nothing else.
  workflow_dispatch:
  push:
    branches: ['e2e-baseline/**']

permissions:
  contents: read

jobs:
  baseline:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      repoint_images: false
