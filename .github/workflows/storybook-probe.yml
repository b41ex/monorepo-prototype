'on':
  push:
    branches: [feature/storybook-pages]
    paths: [.github/workflows/storybook-probe.yml]

name: Storybook store probe

# ---------------------------------------------------------------------------------------
# THROWAWAY. Measures the three things the ghcr-backed Storybook store depends on, before any
# of it is built. Delete this file once the answers are recorded.
#
#   1. Can GITHUB_TOKEN delete a container package VERSION owned by a personal account? The
#      docs only speak to granular-permission registries and say nothing about user scope.
#      If this fails, the design needs a PAT and the option comparison reopens.
#   2. Does a pointer pushed as its own manifest have its own version, so deleting it leaves
#      the content it names intact?
#   3. Does deleting a version remove EVERY tag on that manifest? This is why pointers cannot
#      be `oras tag` aliases of the content.
#
# Nothing exits early. Every observation is recorded and the verdict is computed at the end,
# because a probe that stops at the first surprise answers one question out of three.
# ---------------------------------------------------------------------------------------

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PKG: storybook-probe
      REF: ghcr.io/${{ github.repository_owner }}/storybook-probe
      SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.4

      - name: probe
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          row() { printf '| %s | %s | %s |\n' "$1" "$2" "$3" | tee -a "$GITHUB_STEP_SUMMARY"; }
          expect() { # name expected actual
            if [ "$2" = "$3" ]; then row "$1" "$3" ok; else row "$1" "$3 (expected $2)" '**FAIL**'; fail=1; fi
          }
          printf '### Storybook store probe\n\n| check | observed | |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          echo "$GH_TOKEN" | oras login ghcr.io -u '${{ github.actor }}' --password-stdin
          src="org.opencontainers.image.source=https://github.com/${{ github.repository }}"

          # Content A, and a pointer to it pushed as a SEPARATE manifest.
          mkdir -p a && echo "content-a $SUFFIX" > a/index.html && tar czf a.tar.gz -C a .
          oras push "$REF:src-$SUFFIX-a" --artifact-type application/vnd.b41ex.storybook.v1 \
            --annotation "$src" a.tar.gz
          echo "src-$SUFFIX-a" > pointer.txt
          oras push "$REF:branch-$SUFFIX" --artifact-type application/vnd.b41ex.storybook-pointer.v1 \
            --annotation "$src" --annotation "com.b41ex.storybook.content=src-$SUFFIX-a" pointer.txt

          # Content B, with an ALIAS tag on the same manifest.
          mkdir -p b && echo "content-b $SUFFIX" > b/index.html && tar czf b.tar.gz -C b .
          oras push "$REF:src-$SUFFIX-b" --artifact-type application/vnd.b41ex.storybook.v1 \
            --annotation "$src" b.tar.gz
          oras tag "$REF:src-$SUFFIX-b" "alias-$SUFFIX"

          da="$(oras resolve "$REF:src-$SUFFIX-a")"; dp="$(oras resolve "$REF:branch-$SUFFIX")"
          db="$(oras resolve "$REF:src-$SUFFIX-b")"; dl="$(oras resolve "$REF:alias-$SUFFIX")"
          expect 'pointer has its own digest' yes "$([ "$da" != "$dp" ] && echo yes || echo no)"
          expect 'alias shares the content digest' yes "$([ "$db" = "$dl" ] && echo yes || echo no)"

          versions="$(gh api "users/$OWNER/packages/container/$PKG/versions?per_page=100" 2>&1)"; rc=$?
          expect 'list versions with GITHUB_TOKEN' 0 "$rc"
          echo "$versions" | jq -c '.[] | {id, name, tags: .metadata.container.tags}' || echo "$versions"
          gh api "users/$OWNER/packages/container/$PKG" --jq '"visibility=\(.visibility) repo=\(.repository.full_name)"' \
            | while read -r l; do row 'package' "$l" info; done
          vid() { echo "$versions" | jq -r --arg d "$1" '.[] | select(.name == $d) | .id'; }

          # Q1 + Q2: delete the pointer's version. Try the user endpoint, then the
          # authenticated-user one, and record which (if either) accepts an installation token.
          del() {
            for ep in "users/$OWNER" user; do
              out="$(gh api -X DELETE "$ep/packages/container/$PKG/versions/$1" 2>&1)" \
                && { echo "$ep"; return 0; }
              echo "DELETE $ep/…/$1: $out" >&2
            done
            echo none; return 1
          }
          expect 'delete pointer version' "users/$OWNER" "$(del "$(vid "$dp")")"
          sleep 5
          expect 'pointer tag gone' gone "$(oras resolve "$REF:branch-$SUFFIX" >/dev/null 2>&1 && echo present || echo gone)"
          expect 'content A survives' present "$(oras resolve "$REF:src-$SUFFIX-a" >/dev/null 2>&1 && echo present || echo gone)"

          # The content that survived is the content that was pushed.
          mkdir -p pulled && oras pull "$REF:src-$SUFFIX-a" -o pulled >/dev/null \
            && tar xzf pulled/a.tar.gz -C pulled
          expect 'content A round-trips' "content-a $SUFFIX" "$(cat pulled/index.html 2>/dev/null || echo missing)"

          # Q3: deleting the alias's version takes the other tag with it.
          del "$(vid "$dl")" >/dev/null
          sleep 5
          expect 'deleting alias removes src tag too' gone "$(oras resolve "$REF:src-$SUFFIX-b" >/dev/null 2>&1 && echo present || echo gone)"

          # Leave nothing behind but the verdict.
          del "$(vid "$da")" >/dev/null || true
          exit "$fail"
