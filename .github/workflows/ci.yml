'on':
  push:
    branches: [main, develop, release, hotfix, 'feature/**', 'bugfix/**']
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['docs/**', '**/*.md']
  # Dispatchable so release-finish.yml can start this run itself, and that is not a
  # convenience — it is the only way the release can work at all.
  #
  # release-finish creates the version commit and pushes it. A push made with the default
  # GITHUB_TOKEN deliberately does NOT create a workflow run, which is what stops workflows
  # triggering themselves forever. So after that push nothing would build the released tree,
  # and the images would keep whatever they had.
  #
  # `workflow_dispatch` is the documented exception: it always creates a run, GITHUB_TOKEN or
  # not. release-finish therefore pushes, then dispatches this workflow at the new commit —
  # which is also why it has to be a separate RUN rather than more jobs in release-finish.
  # Every job in a run checks out the run's own sha, so a build inside release-finish would
  # build the tree from BEFORE the version bump, and each app's version.json is generated from
  # the manifests at build time.
  workflow_dispatch:

name: CI

# One run per ref. A superseded push has nothing worth finishing, and cancelling frees the
# cache lock for the run that replaces it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI=true makes pnpm default to --frozen-lockfile, which is what we want here and is worth
  # being explicit about rather than inheriting.
  HUSKY: '0'

jobs:
  # ---------------------------------------------------------------------------------------
  # plan — compute the affected set once, and hand it to the matrix jobs as JSON.
  #
  # Without this every downstream job would recompute `nx affected`, which needs a full
  # install to do. One job pays that cost; the rest read two JSON arrays.
  # ---------------------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      screenshot_projects: ${{ steps.affected.outputs.screenshot_projects }}
      image_projects: ${{ steps.affected.outputs.image_projects }}
      go_projects: ${{ steps.affected.outputs.go_projects }}
    steps:
      - uses: actions/checkout@v6
        with:
          # nx affected diffs against a base commit, so it needs history, not a shallow clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # Resolves the base and head SHAs nx should diff between: the merge-base for a PR, and
      # the last successful run of this workflow for a push. Without it, a push to a feature
      # branch has no defensible base and `affected` silently means "everything".
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          affected="$(pnpm exec nx show projects --affected --json)"
          echo "affected: $affected"

          # Intersect the affected set with the projects that actually have the target. A
          # matrix over an empty array is skipped, which is exactly what should happen.
          pick() {
            node -e '
              const affected = new Set(JSON.parse(process.argv[1]))
              const candidates = process.argv.slice(2)
              console.log(JSON.stringify(candidates.filter((c) => affected.has(c))))
            ' "$affected" "${@}"
          }

          shots="$(pick api-doc-viewer apispec-view class-view)"

          # The Go set is DERIVED FROM THE `lang:go` TAG, never listed here. The `go` job
          # selects that tag and the `js` job excludes it, and those two have to stay exact
          # complements of each other forever. A list in this file would be a third place to
          # keep in step, and the seventh Go module is when it stops being.
          #
          # Note this is `run-many` over an explicit list, not `nx affected --projects=…`.
          # `nx affected` does NOT understand `--projects`: it forwards the flag to the task
          # as an extra argument. Measured — every Go build ran and failed with
          # `malformed import path "--projects=tag:lang:go": leading dash`, while nx reported
          # it under `With additional flags:`. A target that tolerated stray arguments would
          # have run over the whole affected set while looking filtered. `--exclude` IS
          # understood, which is why the js job can use it directly.
          go_all="$(pnpm exec nx show projects --projects=tag:lang:go --json)"
          go="$(pick $(node -e 'console.log(JSON.parse(process.argv[1]).join(" "))' "$go_all"))"

          # IMAGES ARE NOT SELECTED BY `affected`, DELIBERATELY. Both always run.
          #
          # `nx affected` answers a question about COMMITS — what changed between NX_BASE and
          # NX_HEAD. Whether `:dev` / `:next` / `:feature-x` points at the right image is a
          # question about the REGISTRY. Gating the job on the first silently assumes the
          # second, and the assumption is: "this ref's floating tag already points at the
          # content built from NX_BASE". That holds on a branch which has been building
          # continuously, and breaks whenever a ref's identity moves independently of its
          # diff:
          #
          #   release start   `git switch -C release develop` moved release 1071b10 -> 36b8114
          #                   while `git diff develop release` was EMPTY, which is the design's
          #                   own success criterion for the step. Nothing affected, images
          #                   skipped, and :next went on pointing at the PREVIOUS release.
          #                   Measured: :dev 93a6a619… vs :next 74715936… on apihub-ui.
          #   a cancelled run the tag never moved, and the next push sees no diff to notice
          #   a new branch     its floating tag has never existed
          #   a deleted tag    nothing in the commit graph can see that
          #
          # None of that is expensive to fix, because the job does NOT build unconditionally:
          # `Has this content already been built?` checks the content-addressed `src-<hash>`
          # tag in the registry and takes the retag path — a manifest operation, about a
          # second, no layers — when it hits. So `affected` was gating the cheap half while
          # the expensive half was already gated properly, one step later, by the right thing.
          #
          # This also subsumes the rule it replaces. `.dockerignore`, `tools/ci/` and this
          # workflow belong to no Nx project, so a change to one marked nothing affected and
          # the images skipped — which shipped a `.dockerignore` change unvalidated once. That
          # needed a forcing rule while selection was by `affected`; with selection removed,
          # there is nothing left to force. The diff is still computed, purely so the summary
          # can say what moved.
          images='["ui-portal","build-task-consumer","agent","test-service","agents-backend","api-linter-service","portal-backend"]'
          image_inputs="$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- \
            .dockerignore tools/ci .github/workflows/ci.yml .github/actions || true)"

          echo "screenshot_projects=$shots" >> "$GITHUB_OUTPUT"
          echo "image_projects=$images"     >> "$GITHUB_OUTPUT"
          echo "go_projects=$go"          >> "$GITHUB_OUTPUT"

          # The summary is a Mermaid diagram rather than three lines of text, because the
          # value here is in the NEGATIVE space: a skipped screenshot job is 1,888 tests and
          # about twenty minutes not spent, and a skipped job looks identical whether the
          # skip was correct or a bug in the affected computation. Job selection has no
          # equivalent of Nx's `Cache: N/N hit` line to read, so the reasoning has to be
          # rendered deliberately.
          pnpm exec nx graph --file=plan-graph.json >/dev/null
          node tools/ci/plan-summary.js plan-graph.json \
            "$affected" "$shots" "$images" "$image_inputs" "$go" >> "$GITHUB_STEP_SUMMARY"
          rm -f plan-graph.json

      # Same block in every job, rendered by tools/ci/cache-summary.sh so the seven of them
      # cannot drift apart. `always()` because a failed job is when the numbers matter most.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'plan' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # js — lint, build and unit test, in ONE job.
  #
  # §6 decided this deliberately: `nx run-many` on a single runner parallelises across cores
  # in topological order with a warm cache and no artifact upload/download between projects.
  # Nineteen jobs passing dist/ around would be slower and far more complex. The cost is
  # coarser granularity in the Actions UI; nx prefixes output per project, so it is a
  # navigation cost rather than a loss of information.
  #
  # This job gates everything downstream via `needs`.
  # ---------------------------------------------------------------------------------------
  js:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      # `build,test` together, never build alone. §12: "Test-only dependencies are otherwise
      # never exercised, and you will declare half the graph believing you are finished."
      #
      # vscode is excluded for phase 1: its test target downloads a 341 MB VS Code runner and
      # its packaging step is a known failure (vsce shells out to `npm list`, which cannot
      # read pnpm's layout). Recorded as a gap in CI-DESIGN.md rather than worked around.
      - name: lint, build and test what is affected
        run: |
          # pipefail so a failing nx still fails the step; tee alone would return 0.
          set -o pipefail
          pnpm exec nx affected -t build test --exclude=vscode,tag:lang:go --verbose 2>&1 | tee "$RUNNER_TEMP/nx.log"

      # Same block in every job, rendered by tools/ci/cache-summary.sh so the seven of them
      # cannot drift apart. `always()` because a failed job is when the numbers matter most.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'js' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

      # No dist artifact is uploaded for the screenshot job, deliberately. Its
      # `screenshot-test` target declares dependsOn ["build", "^build"], so Nx schedules the
      # builds itself. Uploading and downloading `frontend/*/dist` would move hundreds of
      # megabytes, and it is exactly the artifact shuffling the single-JS-job decision exists
      # to avoid.
      #
      # An earlier version of this comment said the screenshot job "restores them from the
      # computation cache this job just populated, since the screenshot job restores the same
      # cache key prefix". That was true when written and stopped being true the moment the
      # cache key was scoped by `github.job` to stop `plan` poisoning `js`'s key — after which
      # no job can read another's cache by construction. The runner said so plainly and the
      # comment was never revisited:
      #
      #   Cache not found for input keys: nx-Linux-develop-screenshot-tests-33889988315, …
      #   Cache:  0/3 hit (0%)          class-view
      #   Cache:  0/9 hit (0%)          api-doc-viewer
      #   Cache:  0/11 hit (0%)         apispec-view
      #
      # The screenshot jobs have always built their own closures. That is why they no longer
      # wait for this one.

  # ---------------------------------------------------------------------------------------
  # go — build and unit test the Go modules, in ONE job, for the same reason `js` is one job.
  #
  # SEPARATE FROM `js` rather than folded into it. The two need different toolchains, and a
  # job named `js` that installs Go and builds five services would misreport what it covers.
  # They run in parallel and neither gates the other.
  #
  # SELECTED FROM THE PLAN, not recomputed. `nx affected` cannot be narrowed to a project set
  # — it silently forwards `--projects` to the task — so `plan` intersects the affected set
  # with the `lang:go` tag once and this job runs `run-many` over exactly that list.
  #
  # AND THE JOB IS SKIPPED WHEN THAT LIST IS EMPTY, deliberately. `nx run-many` over an empty
  # project list exits 0 having done nothing, which is indistinguishable from a pass in the
  # Actions UI. A skipped job is not. `ci-ok` counts skipped as success.
  # ---------------------------------------------------------------------------------------
  go:
    needs: [plan]
    if: needs.plan.outputs.go_projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # ONE Go version for the workspace, read from the file that states it rather than
      # repeated here. backend/.go-version is the `packageManager` of the Go side, and
      # `go-version-file` accepts a .go-version file directly.
      #
      # `cache` defaults to true and keys on the go.sum files. Before G2 was closed there were
      # no go.sum files to key on, so this input had nothing to work with and every run would
      # have re-downloaded every module.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/**/go.sum

      # Before the build, because the build cannot detect what this detects. GOTOOLCHAIN is
      # `auto`, so a module declaring a version the runner did not install downloads one and
      # compiles green. Drift is only visible by reading the directive.
      - name: every Go module on the same version
        shell: bash
        run: |
          printf '### Go version\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          bash tools/ci/go-version-check.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      # `build,test` together, never build alone — §12's rule, and it applies to Go for the
      # same reason: a module's test-only imports are otherwise never resolved.
      - name: build and test what is affected
        shell: bash
        run: |
          # pipefail so a failing nx still fails the step; tee alone would return 0.
          set -o pipefail
          projects="$(node -e 'console.log(JSON.parse(process.argv[1]).join(","))' \
            '${{ needs.plan.outputs.go_projects }}')"
          echo "go projects: $projects"
          pnpm exec nx run-many -t build test --projects="$projects" --verbose 2>&1 \
            | tee "$RUNNER_TEMP/nx.log"

      # VALIDATE THE ARTIFACT, NOT THE EXIT CODE. The step above exits 0 in three situations
      # that look identical on the run page: it built six services, it built nothing because
      # `nx run-many` was handed an empty project list, or it built nothing because
      # `go build ./...` matched no package. Both no-ops have already cost this project a
      # green step, so the binaries are asserted rather than assumed.
      #
      # The library exemption lives in the graph, not in the checker: commons-go declares
      # `outputs: []`, and the five applications inherit `{projectRoot}/dist` from
      # targetDefaults. Nothing here names a project.
      - name: the binaries exist
        shell: bash
        run: |
          set -euo pipefail
          projects="$(node -e 'console.log(JSON.parse(process.argv[1]).join(","))' \
            '${{ needs.plan.outputs.go_projects }}')"
          pnpm exec nx graph --file=go-graph.json >/dev/null
          printf '### Go binaries\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          node tools/ci/go-artifacts-check.js go-graph.json "$projects" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          rm -f go-graph.json
          exit "${status:-0}"
      # Same block as every other job. It carries no Go-specific row: `go build` and `go test`
      # print no cache verdict of their own, and this summary reports only numbers from the
      # tool that used a cache, never from the step that restored one.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'go' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # screenshot-tests — the only real coverage three components have.
  #
  # api-doc-viewer 947 tests, apispec-view 883, class-view 58. Each builds its Storybook
  # showcase, serves it over HTTP, and drives Chrome in a container through jest.
  #
  # G24 lives here: the library build and the showcase build need OPPOSITE externals
  # policies and both exit 0. Do not unify their configs.
  #
  # THIS JOB DOES NOT WAIT FOR `js`, and that is the largest single saving in the pipeline.
  #
  # It used to, for two stated reasons. One was cache reuse, which never existed — the key is
  # job-scoped, so these jobs have always built their own closures and measured `0/3`, `0/9`
  # and `0/11` cache hits. The other was gating, and gating at workspace scope is the wrong
  # scope here: 18 of the 33 projects are in NO screenshot closure, so a failure in
  # `ui-portal` or `rest-playground` used to hold up suites that cannot import them.
  # `class-view`'s closure is ONE project, and it waited ~11.5 minutes for 20 builds and
  # 10,621 unit tests to finish first.
  #
  # Gating is not lost, it is relocated and made per-component: `screenshot-test` declares
  # dependsOn ["build", "^build"], so a broken build fails THIS job at its own build step,
  # naming the project that actually broke, and `ci-ok` still goes red. What changes is that
  # a suite now fails for its own reasons rather than for the workspace's.
  #
  # Measured on run 33889988315, where every job was green:
  #
  #   before   plan 52s -> js 689s -> screenshots 251 / 670 / 767s      ~25 min wall clock
  #   after    plan 52s -> screenshots and js in parallel               ~14 min wall clock
  #
  # It costs runner minutes only on a broken push, where three jobs now discover the break
  # instead of skipping. It costs none on a green one: the builds were already happening here.
  # ---------------------------------------------------------------------------------------
  screenshot-tests:
    needs: [plan]
    if: needs.plan.outputs.screenshot_projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.screenshot_projects) }}
    steps:
      - uses: actions/checkout@v6

      # Each leg caches its OWN closure. Without this they all key on `screenshot-tests`,
      # one leg reserves it and the others log `Failed to save` — so the 9- and 11-task
      # closures were thrown away every run and the next run restored class-view's 3-task
      # cache into all three.
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: screenshot-${{ matrix.project }}

      - name: build showcase and run the suite
        run: |
          set -o pipefail
          pnpm exec nx run ${{ matrix.project }}:screenshot-test 2>&1 | tee "$RUNNER_TEMP/nx.log"

      # Same block in every job, rendered by tools/ci/cache-summary.sh so the seven of them
      # cannot drift apart. `always()` because a failed job is when the numbers matter most.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'screenshot-tests (${{ matrix.project }})' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

      # The suite writes PNG diffs on failure. Without them a red run says only that pixels
      # moved, and the record is explicit that a small diff is not automatically cosmetic.
      # Scoped to THIS matrix project's directory, not the whole repository.
      #
      # The first version searched from the repo root, and the apispec-view job duly uploaded
      # two PNGs belonging to class-view: `01dfd81` committed two `__diff_output__` files on
      # this branch, `__diff_output__` is not gitignored in class-view, and nothing in the
      # apispec-view job runs class-view's suite to clean them. So a failing job reported
      # another component's stale failure evidence, which is worse than reporting none —
      # it looks like a finding.
      - name: collect diffs
        if: failure()
        run: |
          set -euo pipefail
          root="$(pnpm exec nx show project '${{ matrix.project }}' --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).root')"
          echo "collecting under: $root"
          mkdir -p artifact-staging
          find "$root" -path '*/__diff_output__/*' -type f -not -path '*/node_modules/*' \
            -exec cp {} artifact-staging/ \; 2>/dev/null || true
          echo "collected $(find artifact-staging -type f | wc -l) diff file(s) for ${{ matrix.project }}"

      - name: upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-${{ matrix.project }}
          path: artifact-staging
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # js-images / go-images — the same twelve steps, .github/workflows/images.yml, gated per
  # language. See that file for why it is shared rather than duplicated.
  #
  # An image is a publish: it pushes a floating tag to ghcr, and an image tagged from a commit
  # whose unit tests fail is something other people can then pull. `needs` says which tests.
  # ---------------------------------------------------------------------------------------
  js-images:
    needs: [plan, js]
    # `js` has no `if:` and therefore never skips, so the implicit success-of-all-needs check
    # is exactly right here and no `always()` gymnastics are required.
    if: needs.plan.outputs.image_projects != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      images: >-
        [{"project":"ui-portal","image":"apihub-ui","dockerfile":"frontend/ui/Dockerfile",
          "build_projects":"ui-portal,ui-agents","deploy":"","context":".","dockerignore":".dockerignore",
          "workspace_build":"true"},
         {"project":"build-task-consumer","image":"apihub-build-task-consumer",
          "dockerfile":"frontend/build-task-consumer/Dockerfile",
          "build_projects":"build-task-consumer","deploy":"build-task-consumer","context":".","dockerignore":".dockerignore",
          "workspace_build":"true"}]

  go-images:
    needs: [plan, go]
    # `always() &&` with explicit results, unlike js-images, and the asymmetry is the point.
    # `go` carries an `if:` and is SKIPPED when nothing Go is affected. A skipped need fails the
    # implicit check, so these images would vanish on any push touching no Go module — and
    # images are deliberately NOT selected by `affected`, because whether a floating tag points
    # at the right image is a question about the registry and not about commits. A branch whose
    # tag silently stopped moving is the defect §6 records from the release-start case.
    #
    # So: a skipped `go` is a pass here. A failed or cancelled one is not.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.go.result != 'failure' && needs.go.result != 'cancelled'
      && needs.plan.outputs.image_projects != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      images: >-
        [{"project":"agent","image":"apihub-agent","dockerfile":"backend/agent/Dockerfile",
          "build_projects":"agent","deploy":"","context":"backend/agent","dockerignore":".dockerignore",
          "workspace_build":"false"},
         {"project":"test-service","image":"apihub-test-service",
          "dockerfile":"backend/test-service/Dockerfile","build_projects":"test-service",
          "deploy":"","context":"backend/test-service","dockerignore":".dockerignore",
          "workspace_build":"false"},
         {"project":"agents-backend","image":"apihub-agents-backend",
          "dockerfile":"backend/agents-backend/Dockerfile",
          "build_projects":"agents-backend,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false"},
         {"project":"api-linter-service","image":"apihub-api-linter-service",
          "dockerfile":"backend/api-linter-service/Dockerfile",
          "build_projects":"api-linter-service,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false"},
         {"project":"portal-backend","image":"apihub-portal-backend",
          "dockerfile":"backend/portal-backend/Dockerfile",
          "build_projects":"portal-backend,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false"}]


  # ---------------------------------------------------------------------------------------
  # e2e — the product, stood up from the images this run published. See
  # .github/workflows/e2e.yml, which is shared with the baseline run so that the two differ by
  # exactly one step.
  # ---------------------------------------------------------------------------------------
  e2e:
    needs: [plan, js-images, go-images]
    # Unconditional, subject to the images existing. `go-images` can be SKIPPED when nothing Go
    # is affected, and a skipped need fails the implicit check, so the same explicit form the
    # image jobs use appears here for the same reason.
    if: >-
      always()
      && needs.js-images.result == 'success'
      && needs.go-images.result != 'failure' && needs.go-images.result != 'cancelled'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      repoint_images: true


  # ---------------------------------------------------------------------------------------
  # ci-ok — the only required check.
  #
  # With affected-based skipping, a required status check that never runs blocks the PR
  # forever. This one always runs and fails if any needed job failed or was cancelled;
  # `skipped` is a pass, which is the whole point.
  # ---------------------------------------------------------------------------------------
  ci-ok:
    needs: [plan, js, go, screenshot-tests, js-images, go-images, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results"
          bad="$(node -e '
            const needs = JSON.parse(process.argv[1])
            const bad = Object.entries(needs)
              .filter(([, v]) => v.result === "failure" || v.result === "cancelled")
              .map(([k, v]) => `${k}=${v.result}`)
            console.log(bad.join(" "))
          ' "$results")"
          if [ -n "$bad" ]; then
            echo "FAILED: $bad"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"

  # ---------------------------------------------------------------------------------------
  # publish — the npm half of §8's release finish, on main only.
  #
  # §6 targets rung 1 of the publishing ladder, which is "nothing publishes from a DEV
  # branch". Release publishing was never in question: the component READMEs advertise
  # `npm add @netcracker/qubership-apihub-api-doc-viewer`, so these are public libraries and
  # the stable channel matters. This job is that channel; its absence was a gap in the
  # prototype, not a decision, and this file previously implied otherwise.
  #
  # GATED ON ci-ok, not on the individual jobs. ci-ok is the one required check and already
  # encodes "every needed job succeeded or was correctly skipped", including the screenshot
  # suites that are the only real coverage three components have. Depending on it means a red
  # anything cannot publish, and it avoids re-deriving that logic in a second place where the
  # two could drift.
  #
  # PUBLISHES WITH pnpm, NEVER npm. npm does not understand the `workspace:` protocol outside
  # an npm workspace: `npm pack` puts the literal string `workspace:^` in the tarball's
  # dependency ranges and does not error, producing a package that is uninstallable for every
  # consumer. pnpm rewrites it to a real semver range at pack time. This is why §8 gives Nx
  # the metadata and pnpm the publishing.
  #
  # WHAT GETS PUBLISHED is decided by `private: true` in each manifest and nothing else — no
  # allow-list here to drift out of step with it. Measured before this job existed: pnpm
  # would publish 14 packages, and `nx release version --git-tag` would tag the same 14.
  # They agree only because six manifests declaring `private` as the STRING "true" were
  # normalised to the boolean, and four applications and a test suite were marked private at
  # all; before that, Nx said 17 and pnpm said 18.
  # ---------------------------------------------------------------------------------------
  publish:
    needs: [ci-ok]
    # `always() &&` is load-bearing, and its absence cost a run. The first version of this
    # job read `if: github.ref == 'refs/heads/main'`, which is true on main — and the job was
    # SKIPPED anyway, on a fully green run.
    #
    # The cause is skip propagation reaching through `ci-ok`. `screenshot-tests` was skipped
    # (nothing affected was downstream of the change), so `ci-ok` would have been skipped too
    # and survives only because it carries `if: always()`. That rescue does not extend to
    # ci-ok's own dependents: a custom `if:` without `always()` still carries the implicit
    # success-of-all-needs check, and a skip upstream of ci-ok propagates past it.
    #
    # Naming ci-ok's RESULT explicitly is what makes this immune. It also states the
    # intention directly — publish when the required check actually passed — rather than
    # relying on a default whose behaviour through a skipped job is not obvious.
    if: always() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: publish

      # The token goes in ~/.npmrc, deliberately NOT in the repository's .npmrc.
      #
      # G32 is exactly this mistake made upstream: build-task-consumer's README tells a
      # developer to add a PAT to a TRACKED .npmrc, and its Dockerfile.local then COPYs that
      # file into an image layer. One `git commit -a` from publishing a credential, and a
      # token readable by anyone who can pull the image.
      #
      # ~/.npmrc is outside the repository and outside every docker build context, so neither
      # failure is reachable from here. The repo .npmrc keeps only the scope-to-registry
      # mapping, which is not a secret.
      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          echo "wrote auth for npm.pkg.github.com to ~/.npmrc"
          echo "repo .npmrc is untouched:"
          git diff --exit-code --stat .npmrc && echo "  clean"

      # --no-git-checks because the tree carries release tags and CI checks out a detached
      # head; pnpm otherwise refuses to publish from a non-branch checkout.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          pnpm publish -r --no-git-checks --access restricted 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: What was published
        if: always()
        shell: bash
        run: |
          {
            echo "### npm publish"
            echo
            if grep -qE '^\+ @' "$RUNNER_TEMP/publish.log" 2>/dev/null; then
              echo '| package | version |'
              echo '|---|---|'
              grep -oE '^\+ @[^ ]+' "$RUNNER_TEMP/publish.log" \
                | sed 's/^+ //' \
                | awk -F'@' '{printf "| `@%s` | %s |\n", $2, $3}'
            else
              echo '_Nothing published._ On a re-run of the same commit this is the expected'
              echo 'result: every version already exists in the registry and pnpm skips it.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
